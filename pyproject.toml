[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, simplify, pyupgrade, comprehensions,
# return, misc lint.
select = ["E", "W", "F", "I", "B", "SIM", "UP", "C4", "RET", "PIE"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The codebase stores naive UTC on purpose (app/timeutil.py); 3.12 flags utcnow().
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning"]
