# Single compose file with profiles:
#   Production (server / CI):  docker compose --profile prod up -d --build
#   Local dev (db + pgAdmin):  docker compose --profile dev  up -d
services:
  # ---- Production app (server) ----
  app:
    profiles: ["prod"]
    build: .
    image: aiaa-backend:latest
    container_name: aiaa-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Also set in the Dockerfile; repeated here so a container started from an
      # older image still logs Mongolian time.
      TZ: ${TZ:-Asia/Ulaanbaatar}
    # Bind to localhost only — host nginx is the public entrypoint.
    ports:
      - "127.0.0.1:8000:8000"
    # PosAPI is a daemon on the host, not a compose service. `localhost` inside
    # a container is the container, so EBARIMT_POSAPI_URL must name the host:
    # http://host.docker.internal:7080.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---- eBarimt: hourly push of issued receipts to the tax authority ----
  # Its own container on purpose. Issuing a receipt is instant (PosAPI hands out
  # a DDTD from a pre-allocated lottery pool), so this sendData flush is what
  # actually transmits to the tax authority — it must run on a schedule. It can
  # NOT live inside `app`: gunicorn serves 2 workers, so an in-process scheduler
  # would fire the flush twice an hour.
  ebarimt-sender:
    profiles: ["prod"]
    build: .
    image: aiaa-backend:latest
    container_name: aiaa-ebarimt-sender
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Ulaanbaatar}
    # Same reason as `app`: PosAPI lives on the host, and `localhost` in here is
    # this container. Without it every tick fails with posapi_unreachable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ticks on the hour boundary rather than every 3600s from boot, so a
    # container restart doesn't permanently shift when the flush happens.
    # Set EBARIMT_SEND_INTERVAL_SECONDS in .env to change the cadence.
    #
    # A failed tick must not stop the loop — the next hour retries — but it must
    # not vanish either: receipts the tax authority never received are a
    # compliance problem, and one line among a day of logs is not findable. So
    # consecutive failures are counted and reported as elapsed time, which is
    # the number an operator actually needs.
    command:
      - sh
      - -c
      - |
        interval="$${EBARIMT_SEND_INTERVAL_SECONDS:-3600}"
        echo "[ebarimt-sender] started, interval=$${interval}s"
        fails=0
        while true; do
          if flask ebarimt send-data; then
            fails=0
          else
            fails=$$(( fails + 1 ))
            echo "[ebarimt-sender] ALERT: tick failed ($$fails in a row, ~$$(( fails * interval / 60 ))m since the last successful flush to the tax authority)"
          fi
          sleep $$(( interval - $$(date +%s) % interval ))
        done

  # ---- Local dev database ----
  db:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: aiaa-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ulaanbaatar}
      POSTGRES_USER: ${POSTGRES_USER:-aiaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiaa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiaa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiaa} -d ${POSTGRES_DB:-aiaa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Local dev pgAdmin ----
  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4:latest
    container_name: aiaa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ai-academy.asia}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin_data:
